# Run inside a privileged Kata sidecar sharing the Pod process namespace.
Mode = "sandbox"
BlackList = ["netdev_hw", "netdev_qdisc", "metax_gpu", "ascend_npu", "diskio", "tcp_retransmit", "mthreads_gpu", "mthreads_xid"]

[HTTPServer.Auth]
    BearerToken = "REPLACE_WITH_RANDOM_HEX"

[Storage.LocalFile]
    Path = "huatuo-guest-local"

[Pod]
    KubeletReadOnlyPort = 0
    KubeletAuthorizedPort = 0
