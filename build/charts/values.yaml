image:
  repository: docker.io/huatuo/huatuo-bamai
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

rbac:
  create: false
  # Kubernetes 1.33+ (KubeletFineGrainedAuthz) supports least-privilege
  # nodes/pods and nodes/configz get permissions. Set allowLegacyNodesProxy
  # to true only on older clusters without fine-grained kubelet authorization;
  # note that nodes/proxy get also allows WebSocket GET operations
  # (exec/attach/portForward) against containers on nodes.
  allowLegacyNodesProxy: false

config:
  name: huatuo-bamai-config
  fileName: huatuo-bamai.conf
  mountPath: /home/huatuo-bamai/conf/huatuo-bamai.conf
  content: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "19704"
  prometheus.io/path: /metrics

podLabels: {}

hostNetwork: true
hostPID: true
dnsPolicy: ClusterFirst

securityContext:
  privileged: true

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}

tolerations:
  - operator: Exists

affinity: {}

hostPaths:
  proc: /proc
  sys: /sys
  run: /run
  var: /var
  etc: /etc
  data: /var/log/huatuo/huatuo-local

localStorage:
  mountPath: /home/huatuo-bamai/huatuo-local
