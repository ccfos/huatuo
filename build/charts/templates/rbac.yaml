{{- if .Values.rbac.create -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) -}}
{{- fail "rbac.create requires a dedicated ServiceAccount: set serviceAccount.create=true or serviceAccount.name" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "huatuo.rbacName" . }}
  labels:
    {{- include "huatuo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      {{- if .Values.rbac.allowLegacyNodesProxy }}
      - "nodes/proxy"
      {{- else }}
      - "nodes/pods"
      - "nodes/configz"
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "huatuo.rbacName" . }}
  labels:
    {{- include "huatuo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "huatuo.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "huatuo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
