tracers:
  ras:
    description: Hardware errors (MCE/EDAC/AER/GHES)
    target_type: [host]
    has_profiler: false
    key_fields:
      type:
        description: Error severity (Corrected/UncorrectedRecoverable/UncorrectedDeferred/UncorrectedFatal)
      event:
        description: Error source (MCE/EDAC/NON_STANDARD/AER/MCE_THRESHOLD)
      dev:
        description: Device information
      info:
        description: Error details
    match_field:
      host: hostname
    metric_keywords: [ras]
  lacp:
    description: Bond LACP events
    target_type: [host]
    has_profiler: false
    key_fields:
      content:
        description: Raw bond status text from /proc/net/bonding
    match_field:
      host: hostname
    metric_keywords: [netdev]
  netdev_events:
    description: Network interface link-state changes
    target_type: [host]
    has_profiler: false
    key_fields:
      ifname:
        description: Network interface name
      linkstatus:
        description: Link up/down state
      driver:
        description: Driver name
    match_field:
      host: hostname
    metric_keywords: [netdev]

related_tracers:
  ras: []
  lacp: [netdev_events]
  netdev_events: [lacp, dropwatch]
