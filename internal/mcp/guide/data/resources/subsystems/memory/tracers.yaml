tracers:
  memburst:
    description: Sudden memory usage increase
    target_type: [host]
    has_profiler: false
    key_fields:
      top_memory_usage:
        description: Processes with the highest memory usage
    match_field:
      host: hostname
    metric_keywords: [memory_vmstat, memory_free, memory_events, memory_reclaim]
  oom:
    description: OOM-kill events
    target_type: [host]
    has_profiler: false
    key_fields:
      victim_pid:
        description: PID of the killed process
      victim_process_name:
        description: Name of the killed process
      victim_container_hostname:
        description: Container hostname of the killed process
      trigger_pid:
        description: PID of the process that triggered OOM
      trigger_process_name:
        description: Name of the process that triggered OOM
    match_field:
      host: hostname
    metric_keywords: [oom]
  memory_reclaim:
    description: Container direct-reclaim latency
    target_type: [container]
    has_profiler: false
    key_fields:
      deltatime:
        description: Reclaim duration
      comm:
        description: Process name
      pid:
        description: Process PID
    match_field:
      container: container_hostname
    metric_keywords: [memory_reclaim, memory_others]
  hungtask:
    description: Kernel hung task (D-state timeout)
    target_type: [host]
    has_profiler: false
    key_fields:
      pid:
        description: Hung task PID
      comm:
        description: Hung task command name
    match_field:
      host: hostname
    metric_keywords: [hungtask]

related_tracers:
  memburst: [cpusys, iotracing, oom, memory_reclaim]
  oom: [memburst, memory_reclaim]
  memory_reclaim: [memburst, oom]
  hungtask: [dload, iotracing]
