package: node
generate:
  models: true
import-mapping:
  ../components.yaml: huatuo-bamai/apis/v1
output-options:
  skip-prune: true
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms: [API, CPU, HTTP, ID, IO, TCP, URL]
  user-templates:
    imports.tmpl: build/openapi/templates/imports.tmpl
