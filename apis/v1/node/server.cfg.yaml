package: node
generate:
  gin-server: true
  strict-server: true
import-mapping:
  ../components.yaml: github.com/ccfos/huatuo/apis/v1
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms: [API, CPU, CSS, HTTP, ID, IO, TCP, URL]
  user-templates:
    imports.tmpl: build/openapi/templates/imports.tmpl
