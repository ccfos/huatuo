name: build, lint and vendor codes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

jobs:
  changes:
    name: Classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: python3 .github/workflows/scripts/ci-changes.py

  lint-vendor-build:
    name: Build, Lint and Vendor
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build docker image used by linters
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.devel
          push: false
          load: true
          tags: huatuo-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make build, check and vendor
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            huatuo-dev:latest \
            sh -xec '
              git config --global --add safe.directory /workspace
              make build
              make --trace check
              make vendor
              git diff --exit-code
            '
