name: OS Distro QEMU Tests (Reusable)

on:
  workflow_call:
    inputs:
      stage:
        type: string
        default: full
      fast_selection:
        type: string
        default: ''
      os:
        description: Comma-separated distro names, or all
        type: string
        required: false
        default: all
      debug_mode:
        description: 'Debug VM: retain when'
        type: string
        required: false
        default: Disabled
      debug_timeout_minutes:
        description: 'Debug VM: retention (minutes)'
        type: string
        required: false
        default: '90'

jobs:
  # PRs cover representative kernels and cgroup modes; main runs every distro.
  distro-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      fast-image: ${{ steps.build.outputs.fast-image }}
    steps:
      - name: Build matrix
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OS: ${{ inputs.os }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            INPUT_OS=rocky8,openeuler22.03,openeuler24.03,ubuntu26.04,ubuntu20.04
          elif [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            INPUT_OS=all
          elif [[ -z "${INPUT_OS//[[:space:]]/}" ]]; then
            echo "os is required for manual runs" >&2
            exit 1
          fi

          distros='[
            {"arch": "amd64", "os": "ubuntu26.04", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:ubuntu26.04.amd64-20260915032000-8d05de220887-fae8fc715bea6500-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "ubuntu24.04", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:ubuntu24.04.amd64-20260915032000-8d05de220887-fcedeb44fa774175-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "ubuntu22.04", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:ubuntu22.04.amd64-20260915032000-8d05de220887-9548f93344760678-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "ubuntu20.04", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:ubuntu20.04.amd64-20260915032000-8d05de220887-763a29a10e27ccf1-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "debian12", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:debian12.amd64-20260915032000-8d05de220887-1c1844affc9ec324-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "debian13", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:debian13.amd64-20260915032000-8d05de220887-8fc205ebdce62ea0-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "rocky8", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:rocky8.amd64-20260915032000-8d05de220887-a80018bc4ab22aa3-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "rocky9", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:rocky9.amd64-20260915032000-8d05de220887-b7a56faa7fc2bf5c-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "fedora44", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:fedora44.amd64-20260915032000-8d05de220887-6f8e78db95104a60-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "openeuler22.03", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:openeuler22.03.amd64-20260915032000-8d05de220887-3c601405ed9199bb-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "openeuler24.03", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:openeuler24.03.amd64-20260915032000-8d05de220887-64101e9d1a712c78-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "anolis8.10", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:anolis8.10.amd64-20260915032000-f449e1ab76e5-a5153e73d65abc41-efbbd69167ddaa34"},
            {"arch": "amd64", "os": "opencloudos9", "runner": "ubuntu-24.04", "image": "huatuo/os-distro-test:opencloudos9.amd64-20260915032000-f449e1ab76e5-cf94cf60daa13e63-efbbd69167ddaa34"}
          ]'
          matrix=$(jq -cn \
            --arg selected "$INPUT_OS" \
            --argjson distros "${distros?}" '
            def chunks: split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
              | map(select(length > 0));
            ($selected | chunks) as $selected_distros
            | ($selected_distros | length == 0 or any(. == "all")) as $all_selected
            | [ $distros[] | select($all_selected or (.os as $os | $selected_distros | any(. == $os))) ]
            | {include: .}
          ')
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "Invalid os input: $INPUT_OS" >&2
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "fast-image=$(jq -r '.[] | select(.os == "ubuntu26.04") | .image' <<< "$distros")" >> "$GITHUB_OUTPUT"

  # start VMs and test in them
  qemu-vm:
    name: Test in VM (${{ matrix.arch }} ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    needs: [distro-matrix, fast-gate]
    if: github.event_name != 'workflow_dispatch' || inputs.stage != 'fast'
    env:
      ACT_RUN: false
      INTEGRATION_JOBS: 3
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.distro-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host Init
        run: |
          .github/workflows/scripts/qemu-0-host-init.sh "${{ matrix.arch }}"

      - name: Start VM
        id: start-vm
        timeout-minutes: 20
        env:
          VM_IMAGE_REF: ${{ matrix.image }}
        run: |
          .github/workflows/scripts/qemu-1-start-vm.sh \
            "${{ matrix.arch }}" "${{ matrix.os }}"

      - name: Receive generated sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VM startup overlaps generation; wait for the same run's artifact.
          generated_dir="$RUNNER_TEMP/huatuo-generated"
          mkdir -p "$generated_dir"
          for attempt in $(seq 1 180); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | endswith("Generate portable sources")) | .conclusion')
            case "$status" in
              success) break ;;
              failure|cancelled|skipped|timed_out) echo "Source generation: $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          [[ "$status" == success ]] || { echo 'Timed out waiting for generated sources' >&2; exit 1; }
          gh run download "$GITHUB_RUN_ID" --name portable-generated --dir "$generated_dir"
          .github/workflows/scripts/vm-test/sync-generated-to-vm.sh "$generated_dir/portable-generated.tar"

      - name: Prepare VM
        id: prepare-in-vm
        timeout-minutes: 20
        run: .github/workflows/scripts/qemu-2-run-in-vm.sh --prepare-only

      - name: Read VM Go cache key
        id: go-cache-key
        continue-on-error: true
        env:
          VM_IMAGE_REF: ${{ matrix.image }}
        run: .github/workflows/scripts/vm-test/go-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Cache VM Go build
        id: go-cache
        if: steps.go-cache-key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/huatuo-go-build
          key: vm-go-v1-${{ steps.go-cache-key.outputs.key }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            vm-go-v1-${{ steps.go-cache-key.outputs.key }}-

      - name: Restore Go cache into VM
        if: steps.go-cache-key.outputs.key != ''
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh restore

      - name: 'Debug VM: Start session before test'
        id: upterm-before
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.debug_mode == 'Before test' &&
          steps.start-vm.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 1

      - name: 'Debug VM: Retain before test'
        if: steps.upterm-before.outcome == 'success'
        timeout-minutes: 330
        env:
          DEBUG_TIMEOUT_MINUTES: ${{ inputs.debug_timeout_minutes }}
          UPTERM_SSH_COMMAND: ${{ steps.upterm-before.outputs.ssh-command }}
        run: |
          bash .github/workflows/scripts/qemu-debug-vm.sh

      - name: Run in VM
        id: run-in-vm
        timeout-minutes: 90
        run: |
          .github/workflows/scripts/qemu-2-run-in-vm.sh --test-only

      - name: Collect VM Go cache
        if: steps.run-in-vm.outcome == 'success' && steps.go-cache-key.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh save

      - name: 'Debug VM: Start session after test'
        id: upterm-after
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          steps.start-vm.outcome == 'success' &&
          (
            inputs.debug_mode == 'After test always' ||
            (
              inputs.debug_mode == 'After test on failure' &&
              (steps.prepare-in-vm.outcome == 'failure' || steps.run-in-vm.outcome == 'failure')
            )
          )
        continue-on-error: true
        timeout-minutes: 5
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 1

      - name: 'Debug VM: Retain after test'
        if: always() && steps.upterm-after.outcome == 'success'
        timeout-minutes: 330
        env:
          DEBUG_TIMEOUT_MINUTES: ${{ inputs.debug_timeout_minutes }}
          UPTERM_SSH_COMMAND: ${{ steps.upterm-after.outputs.ssh-command }}
        run: |
          bash .github/workflows/scripts/qemu-debug-vm.sh

      - name: Cleanup VM
        if: always()
        run: |
          .github/workflows/scripts/qemu-3-cleanup.sh

  portable-generated:
    name: Generate portable sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev capnproto
          go install github.com/vektra/mockery/v2@v2.53.6
          go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.2
      - name: Generate and verify
        run: make portable-generated
      - uses: actions/upload-artifact@v4
        with:
          name: portable-generated
          overwrite: true
          path: _output/portable-generated.tar
          if-no-files-found: error

  fast-plan:
    name: Plan Ubuntu shards
    needs: distro-matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      VM_IMAGE_REF: ${{ needs.distro-matrix.outputs.fast-image }}
      CI_STAGE: ${{ inputs.stage }}
      FAST_SELECTION: ${{ inputs.fast_selection }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow helpers
        run: python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py'
      - id: plan
        run: |
          [[ "$CI_STAGE" == full || "$CI_STAGE" == fast ]] || exit 2
          python3 .github/workflows/scripts/fast-pass.py plan --selection "$FAST_SELECTION"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-fast-plan
          path: fast-plan/
          overwrite: true
          if-no-files-found: error

  fast-build:
    name: Build once in Ubuntu 26
    needs: [distro-matrix, fast-plan, portable-generated]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VM_IMAGE_REF: ${{ needs.distro-matrix.outputs.fast-image }}
      VM_INIT_KUBERNETES: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free host disk for VM and caches
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Host Init
        run: .github/workflows/scripts/qemu-0-host-init.sh amd64
      - name: Start VM
        timeout-minutes: 20
        run: .github/workflows/scripts/qemu-1-start-vm.sh amd64 ubuntu26.04
      # Keep CI artifacts out of the initial source sync.
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-fast-plan
          path: fast-plan
      - uses: actions/download-artifact@v4
        with:
          name: portable-generated
          path: fast-generated
      - name: Receive generated sources
        run: .github/workflows/scripts/vm-test/sync-generated-to-vm.sh fast-generated/portable-generated.tar
      - name: Prepare VM
        timeout-minutes: 20
        run: .github/workflows/scripts/qemu-2-run-in-vm.sh --prepare-only
      - name: Read VM Go cache key
        id: cache-key
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        if: steps.cache-key.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/huatuo-go-build
          key: vm-go-v1-${{ steps.cache-key.outputs.key }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}-${{ github.sha }}
          restore-keys: vm-go-v1-${{ steps.cache-key.outputs.key }}-
      - name: Restore Go cache
        if: steps.cache-key.outputs.key != ''
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh restore
      - name: Build shared artifacts
        timeout-minutes: 20
        run: bash .github/workflows/scripts/vm-test/fast-pass-vm.sh build
      - name: Collect Go cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.cache-key.outputs.key != ''
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh save
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-fast-build
          path: fast-build/
          overwrite: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Cleanup VM
        if: always()
        run: .github/workflows/scripts/qemu-3-cleanup.sh

  fast-shard:
    name: Ubuntu shard (${{ matrix.id }})
    needs: [distro-matrix, fast-plan, fast-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fast-plan.outputs.matrix) }}
    env:
      VM_IMAGE_REF: ${{ needs.distro-matrix.outputs.fast-image }}
      VM_INIT_KUBERNETES: ${{ format('{0}', matrix.kubernetes) }}
      SHARD_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Free host disk for VM and caches
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Host Init
        run: .github/workflows/scripts/qemu-0-host-init.sh amd64
      - name: Start VM
        id: start
        timeout-minutes: 20
        run: .github/workflows/scripts/qemu-1-start-vm.sh amd64 ubuntu26.04
      # Keep CI artifacts out of the initial source sync.
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-fast-plan
          path: fast-plan
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-fast-build
          path: fast-build
      - name: Prepare VM
        timeout-minutes: 20
        run: .github/workflows/scripts/qemu-2-run-in-vm.sh --prepare-only
      - name: Read VM Go cache key
        id: cache-key
        if: matrix.go_cache
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: matrix.go_cache && steps.cache-key.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/huatuo-go-build
          key: vm-go-v1-${{ steps.cache-key.outputs.key }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}-${{ github.sha }}
          restore-keys: vm-go-v1-${{ steps.cache-key.outputs.key }}-
      - name: Restore Go cache
        if: matrix.go_cache && steps.cache-key.outputs.key != ''
        continue-on-error: true
        run: .github/workflows/scripts/vm-test/go-cache.sh restore
      - name: Run selected tests
        timeout-minutes: 35
        run: bash .github/workflows/scripts/vm-test/fast-pass-vm.sh run
      - name: Collect reports and logs
        if: always() && steps.start.outcome == 'success'
        run: bash .github/workflows/scripts/vm-test/fast-pass-vm.sh collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-fast-result-${{ matrix.id }}-${{ github.run_attempt }}
          path: fast-result/
          retention-days: 7
          if-no-files-found: error
      - name: Cleanup VM
        if: always()
        run: .github/workflows/scripts/qemu-3-cleanup.sh

  fast-gate:
    name: Verify Ubuntu coverage
    needs: [distro-matrix, fast-plan, fast-build, fast-shard]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    env:
      VM_IMAGE_REF: ${{ needs.distro-matrix.outputs.fast-image }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful shard jobs
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-fast-plan
          path: fast-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ubuntu-fast-result-*
          path: fast-results
      - name: Check complete coverage and outcomes
        run: python3 .github/workflows/scripts/fast-pass.py verify
