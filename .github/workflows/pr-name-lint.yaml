name: pr-name-lint
on:
  push:
    branches:
      - main-*
  merge_group:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']
    branches-ignore:
      - "[0-9]+.[0-9]+"

jobs:
  pr_name_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6.1.0
        name: Install Node.js
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          npm install @commitlint/lint@18.6.1 @commitlint/load@18.6.1 @commitlint/config-conventional@18.6.2 @actions/core
      - name: Lint PR and commit messages
        uses: actions/github-script@v8.0.0
        # Only validate on pull requests
        if: github.event_name == 'pull_request'
        with:
          script: |
            const load = require('@commitlint/load').default;
            const lint = require('@commitlint/lint').default;

            const CONFIG = {
              extends: ['./commitlint.config.js'],
            };

            const opts = await load(CONFIG);
            const lintOptions = opts.parserPreset
              ? {parserOpts: opts.parserPreset.parserOpts}
              : {};
            let valid = true;

            async function lintMessage(label, message) {
              core.info(`Linting ${label}`);
              const report = await lint(message, opts.rules, lintOptions);

              report.warnings.forEach((warning) => {
                core.warning(`${label}: ${warning.message}`);
              });
              report.errors.forEach((error) => {
                core.error(`${label}: ${error.message}`);
              });
              valid = valid && report.valid;
            }

            await lintMessage(
              'PR title',
              context.payload.pull_request.title
            );

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );
            for (const commit of commits) {
              await lintMessage(
                `commit ${commit.sha.slice(0, 8)}`,
                commit.commit.message
              );
            }

            if (!valid) {
              core.setFailed('PR title or commit message linting failed');
            }
