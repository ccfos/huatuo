name: OS Distro QEMU Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # start VMs and test in them
  qemu-vm:
    name: Test in VM (${{ matrix.arch }} ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    env:
      ACT_RUN: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu26.04
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:ubuntu26.04.amd64-20260915032000-8d05de220887-fae8fc715bea6500-efbbd69167ddaa34
          - arch: amd64
            os: ubuntu24.04
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:ubuntu24.04.amd64-20260915032000-8d05de220887-fcedeb44fa774175-efbbd69167ddaa34
          - arch: amd64
            os: ubuntu22.04
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:ubuntu22.04.amd64-20260915032000-8d05de220887-9548f93344760678-efbbd69167ddaa34
          - arch: amd64
            os: ubuntu20.04
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:ubuntu20.04.amd64-20260915032000-8d05de220887-763a29a10e27ccf1-efbbd69167ddaa34
          - arch: amd64
            os: debian12
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:debian12.amd64-20260915032000-8d05de220887-1c1844affc9ec324-efbbd69167ddaa34
          - arch: amd64
            os: debian13
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:debian13.amd64-20260915032000-8d05de220887-8fc205ebdce62ea0-efbbd69167ddaa34
          - arch: amd64
            os: rocky8
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:rocky8.amd64-20260915032000-8d05de220887-a80018bc4ab22aa3-efbbd69167ddaa34
          - arch: amd64
            os: rocky9
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:rocky9.amd64-20260915032000-8d05de220887-b7a56faa7fc2bf5c-efbbd69167ddaa34
          - arch: amd64
            os: fedora44
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:fedora44.amd64-20260915032000-8d05de220887-6f8e78db95104a60-efbbd69167ddaa34
          - arch: amd64
            os: openeuler22.03
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:openeuler22.03.amd64-20260915032000-8d05de220887-3c601405ed9199bb-efbbd69167ddaa34
          - arch: amd64
            os: openeuler24.03
            runner: ubuntu-24.04
            image: huatuo/os-distro-test:openeuler24.03.amd64-20260915032000-8d05de220887-64101e9d1a712c78-efbbd69167ddaa34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host Init
        run: |
          .github/workflows/scripts/qemu-0-host-init.sh "${{ matrix.arch }}"

      - name: Start VM
        timeout-minutes: 30
        env:
          VM_IMAGE_REF: ${{ matrix.image }}
        run: |
          .github/workflows/scripts/qemu-1-start-vm.sh \
            "${{ matrix.arch }}" "${{ matrix.os }}"

      - name: Run in VM
        timeout-minutes: 120
        run: |
          .github/workflows/scripts/qemu-2-run-in-vm.sh

      - name: Cleanup VM
        if: always()
        run: |
          .github/workflows/scripts/qemu-3-cleanup.sh
