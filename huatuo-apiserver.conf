# Log Configuration
[Log]
    # - Level
    # The log level for huatuo-apiserver: Debug, Info, Warn, Error, Panic.
    # Default: Info
    #
    # Level = "Info"

# Runtime limits for the huatuo-apiserver process.
[Runtime]
    # - CPULimitCores
    # CPU limit in cores.
    # Default: 20
    #
    # - MemoryLimitMiB
    # Memory limit in MiB.
    # Default: 4096
    #
    # CPULimitCores = 20
    # MemoryLimitMiB = 4096

# HTTP server configuration.
[APIServer]
    # - ListenAddress
    # Listen address in "host:port" form.
    # Default: ":12740"
    #
    # ListenAddress = ":12740"

    # Request rate limiting.
    [APIServer.RateLimit]
        # - RequestsPerSecond
        # Maximum process-wide request rate per second.
        # Default: 200
        #
        # - Burst
        # Maximum process-wide request burst.
        # Default: 200
        #
        # RequestsPerSecond = 200
        # Burst = 200

# Job persistence.
[Jobs]
    # - StoreDSN
    # SQLite DSN. Relative paths are resolved from this file's directory.
    # Default: "jobs.db"
    #
    # StoreDSN = "jobs.db"

    # Profiling and tracing retain independent quotas because their resource
    # costs and expected concurrency differ.
    [Jobs.Profiling]
        # - MaxConcurrentPerHost
        # Maximum concurrent profiling jobs on one host.
        # Default: 3
        #
        # - MaxConcurrent
        # Maximum concurrent profiling jobs across all hosts.
        # Default: 500
        #
        # MaxConcurrentPerHost = 3
        # MaxConcurrent = 500

    [Jobs.Tracing]
        # - MaxConcurrentPerHost
        # Maximum concurrent tracing jobs on one host.
        # Default: 5
        #
        # - MaxConcurrent
        # Maximum concurrent tracing jobs across all hosts.
        # Default: 1000
        #
        # MaxConcurrentPerHost = 5
        # MaxConcurrent = 1000

    # Apiserver-owned Job supervision policy. These values are independent
    # from the Node operation lifecycle settings.
    [Jobs.Controller]
        # StatusPollIntervalSeconds = 5
        # PendingTimeoutSeconds = 30
        # CompletionGracePeriodSeconds = 60
        # NodeUnavailableGracePeriodSeconds = 30
        # JobRetentionPeriodHours = 720

# huatuo-bamai Agent HTTP client configuration.
[Agent]
    # - HTTPPort
    # Agent HTTP server port.
    # Default: 19704
    #
    # HTTPPort = 19704

    [Agent.Auth]
        # Required service credential. It must match HTTPServer.Auth on every
        # huatuo-bamai Node.
        BearerToken = "REPLACE_WITH_RANDOM_HEX"

# Optional Elasticsearch/OpenSearch backend for querying profiling data.
[Elasticsearch]
    # Address, Username, and Password must be configured together to enable
    # this backend.
    #
    # - Address
    # Elasticsearch or OpenSearch HTTP address.
    #
    # - Username
    # Elasticsearch or OpenSearch username.
    #
    # - Password
    # Elasticsearch or OpenSearch password.
    #
    # - Index
    # Index containing huatuo-bamai profiling data.
    # Default: "huatuo_bamai"
    #
    # Address = "http://127.0.0.1:9200"
    # Username = "elastic"
    # Password = "REPLACE_WITH_PASSWORD"
    # Index = "huatuo_bamai"

# Model Context Protocol configuration.
# MCP reads two storage categories: event context (including automatic profiles)
# from Elasticsearch/OpenSearch, and time-series metrics from Prometheus.
[MCP]
    # Model Context Protocol endpoint at /v1/mcp. Requests use the same bearer
    # authentication and authorization policy as the other API routes.
    # It can also be enabled with --enable-mcp or ENABLE_MCP=true.
    # Default: false
    #
    # Enabled = false

    # Maximum in-flight MCP HTTP requests per API server process, shared by all
    # users. Not a TCP connection limit, user count, or requests-per-second limit.
    # Requests hold a slot until they finish; idle keep-alive connections do not.
    # GET streams also count, with a separate cap of max(1, this limit / 4).
    # Excess requests receive HTTP 503 immediately, without queueing.
    # Applies only to MCP, independently of APIServer.RateLimit.
    # Default and upper limit: 200
    #
    # MaxConcurrentRequests = 200

    # Maximum Tool query range in seconds. Zero disables the range cap.
    # Default: 2592000 (30 days)
    # MaxQueryTimeRange = 2592000

    # Maximum exact regions accepted by one Tool call.
    # Default and upper limit: 5
    # MaxRegionsPerQuery = 5

    # Optional directory that overlays the embedded MCP guide tree.
    # GuideOverlayDir = ""

    # User request rate limiting is enforced by the outer API server through
    # APIServer.RateLimit (RequestsPerSecond and Burst). MCP does not maintain
    # a separate per-user rate limit. Backend RateLimit budgets below count
    # actual backend attempts, including retries, across all users and regions.

    [MCP.Events]
        # Event-context storage: anomaly events, call stacks, and automatic profiles
        # in Elasticsearch/OpenSearch. Both use the same read protocol.
        # RateLimit counts backend requests per minute; zero disables it.
        # RateLimit = 300
        # MaxDocumentsPerQuery = 500 # default and upper limit
        # ToolTimeout is the overall budget for one event Tool call, in seconds.
        # It includes regional queries, backend attempts, retries/backoff, and
        # result processing; it is not a per-request timeout or reset per retry.
        # Cancellation is cooperative. The diagnostic_guide Tool is not covered.
        # ToolTimeout = 60
        # Connections exist only in Regions and never inherit from each other
        # or [Elasticsearch]. The first entry is the routing fallback.
        # [[MCP.Events.Regions]]
        #     NamePattern = "^us-"
        #     Address = "http://us-elasticsearch:9200"
        #     Index = "huatuo_bamai"
        #     AuthType = "none"
        # [[MCP.Events.Regions]]
        #     NamePattern = "^eu-"
        #     Address = "http://eu-elasticsearch:9200"
        #     Index = "huatuo_bamai"
        #     AuthType = "basic"
        #     Username = "elastic"
        #     Password = "change_me"

    [MCP.Metrics]
        # Time-series metric storage queried through a Prometheus-compatible API.
        # RateLimit counts backend requests per minute; zero disables it.
        # RateLimit = 300
        # MaxSeriesPerQuery = 3000 # default and upper limit
        # MaxMetricsPerDiscovery = 800 # default and upper limit
        # ToolTimeout is the overall budget for one metrics Tool call, in seconds.
        # It includes regional queries, backend attempts, retries/backoff, and
        # result processing; it is not a per-request timeout or reset per retry.
        # Cancellation is cooperative. The diagnostic_guide Tool is not covered.
        # ToolTimeout = 60
        # Each region requires its own address and credentials; no inheritance.
        # The first entry is the fallback when no region pattern matches.
        # MetricPrefix is empty unless explicitly set for that region.
        # [[MCP.Metrics.Regions]]
        #     NamePattern = "^us-"
        #     Address = "http://us-prometheus:9090"
        #     AuthType = "bearer"
        #     AuthToken = "us-token"
        #     MetricPrefix = "huatuo_us_"
        # [[MCP.Metrics.Regions]]
        #     NamePattern = "^eu-"
        #     Address = "http://eu-prometheus:9090"
        #     AuthType = "none"
        #     MetricPrefix = "huatuo_eu_"

# Authentication configuration.
[Auth]
    # /readyz, /metrics, and /version are public. Flame graph query
    # endpoints and /debug/pprof/** are restricted to administrators.
    #
    # - ID
    # Stable principal identifier stored with jobs.
    #
    # - BearerToken
    # Secret used only to authenticate requests. IDs and tokens must be unique.
    #
    # - Admin
    # Whether the principal has unrestricted API access.
    #
    # - Permissions
    # API method and path patterns granted to a restricted principal.
    #
    # Administrator example:
    # [[Auth.Users]]
    #     ID = "administrator"
    #     BearerToken = "REPLACE_WITH_RANDOM_HEX"
    #     Admin = true
    #
    # Restricted example:
    # [[Auth.Users]]
    #     ID = "huatuo-front"
    #     BearerToken = "REPLACE_WITH_RANDOM_HEX"
    #     Permissions = [
    #         "GET /v1/tracing",
    #         "GET /v1/tracing/**",
    #         "GET /v1/profiling",
    #         "GET /v1/profiling/**",
    #     ]

# Profiling result-link configuration.
[Profiling]
    # - DashboardBaseURL
    # Optional dashboard base URL. Result URLs are omitted when empty.
    # Default: empty
    #
    # DashboardBaseURL = "http://localhost:8006/d"
