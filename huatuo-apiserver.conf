# Log level. Supported: Debug, Info, Warn, Error, Panic.
# Default: Info
# LogLevel = "Info"

# Runtime limits for the huatuo-apiserver process.
[Runtime]
    # CPU limit in cores. Default: 20
    # CPULimitCores = 20
    # Memory limit in MiB. Default: 4096
    # MemoryLimitMiB = 4096

# HTTP server configuration.
[APIServer]
    # Listen address in "host:port" form. Default: ":12740"
    # ListenAddress = ":12740"

    [APIServer.RateLimit]
        # Process-wide request rate and burst capacity. Defaults: 200 / 200
        # RequestsPerSecond = 200
        # Burst = 200

# Job persistence.
[Jobs]
    # SQLite DSN. Relative paths are resolved from this file's directory.
    # Default: "jobs.db"
    # StoreDSN = "jobs.db"

    # Profiling and tracing retain independent quotas because their resource
    # costs and expected concurrency differ.
    [Jobs.Profiling]
        # MaxConcurrentPerHost = 3
        # MaxConcurrent = 500

    [Jobs.Tracing]
        # MaxConcurrentPerHost = 5
        # MaxConcurrent = 1000

# huatuo-bamai Agent HTTP client configuration.
[Agent]
    # HTTPPort = 19704
    # RequestTimeoutSeconds = 10

    [Agent.StatusPolling]
        # IntervalSeconds = 5
        # MaxConsecutiveErrors = 3

# Optional Elasticsearch/OpenSearch backend for querying profiling data.
# Address, Username, and Password must be configured together to enable it.
[Elasticsearch]
    # Address = "http://127.0.0.1:9200"
    # Username = "elastic"
    # Password = "REPLACE_WITH_PASSWORD"
    # Index = "huatuo_bamai"

# Authentication configuration.
[Auth]
    # /healthz, /readyz, /metrics, and /version are public. Flame graph query
    # endpoints and /debug/pprof/** are restricted to administrators.
    #
    # ID is a stable principal identifier stored with jobs. BearerToken is a
    # secret used only to authenticate requests. IDs and tokens must be unique.
    #
    # Administrator example:
    # [[Auth.Users]]
    #     ID = "administrator"
    #     BearerToken = "REPLACE_WITH_RANDOM_HEX"
    #     Admin = true
    #
    # Restricted example:
    # [[Auth.Users]]
    #     ID = "huatuo-front"
    #     BearerToken = "REPLACE_WITH_RANDOM_HEX"
    #     Permissions = [
    #         "GET /v1/traces",
    #         "GET /v1/traces/**",
    #         "GET /v1/profiles",
    #         "GET /v1/profiles/**",
    #     ]

# Profiling subprocess configuration.
[Profiling]
    # Aggregation interval in seconds. Must be > 0 and < 1200. Default: 10
    # AggregationIntervalSeconds = 10
    # Maximum concurrent third-party profiler processes. A value of 0
    # disables this process limit. Default: 10
    # MaxConcurrentProfilerProcesses = 10
    # Optional dashboard base URL. Result URLs are omitted when empty.
    # DashboardBaseURL = "http://localhost:8006/d"
